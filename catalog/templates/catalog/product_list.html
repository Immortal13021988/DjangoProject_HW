{% extends 'catalog/home.html' %}
{% load my_tags %}
{% block content %}
<div class="row text-center">
    {% for prod in object_list %}
    <div class="col-3">
        <div class="card mb-4 box-shadow">
            <div class="card-header">
                <h3 class="my-0 font-weight-normal">{{ prod.name|upper }}</h3>
            </div>
            <img src="{{ prod.photo | media_filter }}">
            <div class="card-body">

                <ul class="list-unstyled mt-3 mb-4 text-start m-3">
                    <li>{{ prod.description|truncatechars:100 }}</li>
                </ul>
                <h4 class="card-title pricing-card-title">{{ prod.price }} р</h4>
                <div class="btn-group" role="group" aria-label="Basic example">
                    <a class="btn btn-primary btn-sm" href="{% url 'catalog:prod_detail' prod.pk %}"
                       role="button">Посмотреть</a>
                    <a class="btn btn-warning btn-sm" href="{% url 'catalog:prod_update' prod.pk %}"
                       role="button">Редактировать</a>
                    <a class="btn btn-danger btn-sm" href="{% url 'catalog:prod_delete' prod.pk %}"
                       role="button">Удалить</a>
                </div>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
