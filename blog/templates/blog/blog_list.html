{% extends 'blog/base.html' %}
{% load blog_tags %}
{% block content %}
<div class="row text-center">
    {% for blog in object_list %}
    <div class="col-3">
        <div class="card mb-4 box-shadow">
            <div class="card-header">
                <h3 class="my-0 font-weight-normal">{{ blog.title|upper }}</h3>
            </div>
            <img src="{{ blog.photo | media_filter }}">
            <div class="card-body">

                <ul class="list-unstyled mt-3 mb-4 text-start m-3">
                    <li>{{ blog.content|truncatechars:100 }}</li>

                <li class="card-title pricing-card-title">Просмотров: {{ blog.views_counter }} </li>
                    </ul>
                <div class="btn-group" role="group" aria-label="Basic example">
                    <a class="btn btn-primary btn-sm" href="{% url 'blog:blog_detail' blog.pk %}"
                       role="button">Посмотреть</a>
                    <a class="btn btn-warning btn-sm" href="{% url 'blog:blog_update' blog.pk %}"
                       role="button">Редактировать</a>
                    <a class="btn btn-danger btn-sm" href="{% url 'blog:blog_delete' blog.pk %}"
                       role="button">Удалить</a>
                </div>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
